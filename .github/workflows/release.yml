name: Release

# Tag triggered only. Push- and PR-triggered CI now lives in ci.yml (added
# once dep-guard is public, so its standard-runner minutes are free
# regardless of the org's billing state for private repos) and gates every
# merge to main. This workflow does not replace that gate - it re-verifies
# the same checks (pnpm build / pnpm typecheck / pnpm lint / pnpm test)
# right before anything is published, in case main moved between the
# merge and the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serializes every release attempt across the whole repository, tag
# triggered or workflow_dispatch, so a manual re-run overlapping a
# tag-triggered run cannot both pass the "already published" check before
# either publishes and race each other into a rejected duplicate-version
# publish. Never cancel a run mid-publish; queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.14.0
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Typecheck
      run: pnpm typecheck

    - name: Lint (public repository hygiene guard)
      run: pnpm lint

    - name: Run tests
      run: pnpm test

    # MUST run after "Run tests", never before. packages/cli/tests/cli.test.ts
    # has a case ("a first run with no corpus built yet") that asserts a
    # scan with no --corpus-dir and nothing at core's default corpus path
    # (packages/core/data/corpus) fails with an actionable corpus-missing
    # message. That default path is gitignored and empty in every checkout
    # unless something writes there first -- if this step ran before the
    # test suite, that test would fail (or worse, silently stop testing
    # what it claims to, if it were ever weakened to tolerate a populated
    # default path). See that test's own self-diagnosing precondition
    # check for the same explanation from the test's side.
    #
    # This step makes every release depend on replicate.npmjs.com, the
    # public registry replica -- roughly 430 requests and 10 to 15 minutes
    # (see scripts/build-corpus.mjs). A failure here fails the release
    # closed, before anything is published, which is the correct direction:
    # a release with no corpus, or a corpus this build could not verify, is
    # worse than a delayed release.
    - name: Build the shipped corpus
      run: node scripts/build-corpus.mjs --out packages/core/data/corpus

    # Refuses to publish a corpus that is not actually fit to ship -- see
    # scripts/lib/shippable-corpus.mjs for the full set of checks (all four
    # files present, formatVersion and walkComplete both present and
    # correct, a name-count floor, and a real load through loadCorpus with
    # a known-popular name resolving as present). This is stricter than
    # what loadCorpus itself tolerates at read time, by design.
    - name: Check the corpus is fit to publish
      run: node scripts/check-shippable-corpus.mjs packages/core/data/corpus

    # npm Trusted Publishing (OIDC): no NPM_TOKEN, auth via id-token: write
    # plus a trusted publisher configured per @vaultcompass/* package.
    # Requires npm CLI >= 11.5.1 (Node >= 22.14.0). Pin major 11 - npm@12
    # needs a newer Node than this job runs. Mirrors vault-guard's
    # release.yml, the model for this workflow.
    - name: Upgrade npm for OIDC trusted publishing
      run: npm install -g npm@11

    # dep-guard-cli depends on dep-guard-core via workspace:*, which pnpm
    # rewrites to a real semver range at publish time - core still
    # publishes first for a clean read of "what's live" if this fails
    # partway through. Skips a package already on the registry at its
    # current version, so a failed mid-release can be re-run without
    # erroring on a duplicate version.
    - name: Publish to npm
      run: |
        set -euo pipefail
        for dir in packages/core packages/cli; do
          name="$(node -p "require('./${dir}/package.json').name")"
          ver="$(node -p "require('./${dir}/package.json').version")"
          if [[ "$(npm view "${name}@${ver}" version 2>/dev/null || true)" == "${ver}" ]]; then
            echo "Skip ${name}@${ver} (already on registry)"
            continue
          fi
          echo "Publishing ${name}@${ver}"
          pnpm --filter "${name}" publish --access public --no-git-checks
        done

    - name: Resolve release tag
      id: meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Published `@vaultcompass/dep-guard` and `@vaultcompass/dep-guard-core` to npm.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    runs-on: ubuntu-latest
    steps:
      # No checkout step: this job's whole point is to exercise ONLY what a
      # real installer gets from npm, and every command below reads solely
      # from the installed @vaultcompass/dep-guard package (no --corpus-dir,
      # no repo files of any kind). Re-add a checkout only if a future
      # change here needs something from this repository directly.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package and assert it scans correctly
        shell: bash
        env:
          # Read from the release job's own output rather than recomputing
          # the tag/version resolution a second time - two copies of that
          # branching logic could drift and have the two jobs disagree on
          # which version was just released.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "Smoke testing @vaultcompass/dep-guard@${VERSION}"

          FOUND=0
          for i in $(seq 1 12); do
            if [[ "$(npm view "@vaultcompass/dep-guard@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              echo "Package visible on registry."
              FOUND=1
              break
            fi
            echo "Waiting for npm registry (attempt ${i}/12)..."
            sleep 10
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out waiting for @vaultcompass/dep-guard@${VERSION} on the npm registry."
            exit 1
          fi

          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/dep-guard@${VERSION}"

          # No --corpus-dir anywhere below. That is the whole point of this
          # job: it has to exercise the corpus that actually shipped INSIDE
          # the published package (packages/core's "files" now lists
          # "data" alongside "dist" - see packages/core/package.json) at
          # the default path scan.ts resolves when nothing overrides it.
          # Pointing this job at the repository's fixture corpus, the way
          # it used to, would smoke-test a corpus that never left this
          # checkout and prove nothing about what got published.
          set +e
          ./node_modules/.bin/dep-guard check react --format json > known-out.json
          KNOWN_EC=$?
          set -e

          if [[ "${KNOWN_EC}" -ne 0 ]]; then
            echo "::error::Expected 'dep-guard check react' to exit 0 (react should be present in any real, complete corpus)."
            cat known-out.json || true
            exit 1
          fi

          # A single hallucinated name used to be enough here, on the
          # reasoning that its non-collision against the bloom filter was a
          # deterministic property of one exact string checked against one
          # exact COMMITTED fixture corpus, verified by hand once. That
          # reasoning does not survive this job dropping --corpus-dir: the
          # corpus is now rebuilt from a live registry walk on every
          # release (see the "Build the shipped corpus" step in this
          # workflow), so a single name's non-collision is effectively a
          # fresh draw against the target false-positive rate (0.001) on
          # every release, which means a spurious, deeply confusing release
          # failure roughly once every thousand releases. Three distinct
          # hallucinated names bring the probability that ALL THREE collide
          # down to roughly 1e-9, while still proving exactly what matters:
          # the shipped corpus plus the shipped CLI agree that a name which
          # is not real is not real.
          set +e
          ./node_modules/.bin/dep-guard check totally-made-up-hallucinated-xyz123 --format json > unknown-1.json
          UNKNOWN_EC_1=$?
          ./node_modules/.bin/dep-guard check zzq-nonexistent-fictional-pkg-482716 --format json > unknown-2.json
          UNKNOWN_EC_2=$?
          ./node_modules/.bin/dep-guard check qwzx-imaginary-not-a-real-package-9284 --format json > unknown-3.json
          UNKNOWN_EC_3=$?
          set -e

          node -e "
            const fs = require('fs');
            const cases = [
              ['unknown-1.json', ${UNKNOWN_EC_1}],
              ['unknown-2.json', ${UNKNOWN_EC_2}],
              ['unknown-3.json', ${UNKNOWN_EC_3}],
            ];
            const hit = cases.some(([file, exitCode]) => {
              if (exitCode === 0) return false;
              const j = JSON.parse(fs.readFileSync(file, 'utf8'));
              return (j.findings || []).some((f) => f.ruleId === 'unknown-package');
            });
            if (!hit) {
              console.error('Expected at least one of three hallucinated names to exit non-zero with an unknown-package finding.');
              for (const [file] of cases) {
                console.error(file, fs.readFileSync(file, 'utf8'));
              }
              process.exit(1);
            }
          "
          echo "Release smoke passed."
