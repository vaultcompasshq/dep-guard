name: Release

# Tag triggered only. Push- and PR-triggered CI now lives in ci.yml (added
# once dep-guard is public, so its standard-runner minutes are free
# regardless of the org's billing state for private repos) and gates every
# merge to main. This workflow does not replace that gate - it re-verifies
# the same checks (pnpm build / pnpm typecheck / pnpm lint / pnpm test)
# right before anything is published, in case main moved between the
# merge and the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serializes every release attempt across the whole repository, tag
# triggered or workflow_dispatch, so a manual re-run overlapping a
# tag-triggered run cannot both pass the "already published" check before
# either publishes and race each other into a rejected duplicate-version
# publish. Never cancel a run mid-publish; queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.14.0
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Typecheck
      run: pnpm typecheck

    - name: Lint (public repository hygiene guard)
      run: pnpm lint

    - name: Run tests
      run: pnpm test

    # npm Trusted Publishing (OIDC): no NPM_TOKEN, auth via id-token: write
    # plus a trusted publisher configured per @vaultcompass/* package.
    # Requires npm CLI >= 11.5.1 (Node >= 22.14.0). Pin major 11 - npm@12
    # needs a newer Node than this job runs. Mirrors vault-guard's
    # release.yml, the model for this workflow.
    - name: Upgrade npm for OIDC trusted publishing
      run: npm install -g npm@11

    # dep-guard-cli depends on dep-guard-core via workspace:*, which pnpm
    # rewrites to a real semver range at publish time - core still
    # publishes first for a clean read of "what's live" if this fails
    # partway through. Skips a package already on the registry at its
    # current version, so a failed mid-release can be re-run without
    # erroring on a duplicate version.
    - name: Publish to npm
      run: |
        set -euo pipefail
        for dir in packages/core packages/cli; do
          name="$(node -p "require('./${dir}/package.json').name")"
          ver="$(node -p "require('./${dir}/package.json').version")"
          if [[ "$(npm view "${name}@${ver}" version 2>/dev/null || true)" == "${ver}" ]]; then
            echo "Skip ${name}@${ver} (already on registry)"
            continue
          fi
          echo "Publishing ${name}@${ver}"
          pnpm --filter "${name}" publish --access public --no-git-checks
        done

    - name: Resolve release tag
      id: meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Published `@vaultcompass/dep-guard` and `@vaultcompass/dep-guard-core` to npm.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fixture corpus only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package and assert it scans correctly
        shell: bash
        env:
          # Read from the release job's own output rather than recomputing
          # the tag/version resolution a second time - two copies of that
          # branching logic could drift and have the two jobs disagree on
          # which version was just released.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "Smoke testing @vaultcompass/dep-guard@${VERSION}"

          FOUND=0
          for i in $(seq 1 12); do
            if [[ "$(npm view "@vaultcompass/dep-guard@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              echo "Package visible on registry."
              FOUND=1
              break
            fi
            echo "Waiting for npm registry (attempt ${i}/12)..."
            sleep 10
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out waiting for @vaultcompass/dep-guard@${VERSION} on the npm registry."
            exit 1
          fi

          # The fixture corpus ships in this checkout, not in the published
          # package (packages/core's "files" is dist-only), so it is read
          # from the repo the same way vault-guard reads its release-smoke
          # fixture: checked out for data, not for code.
          CORPUS="${GITHUB_WORKSPACE}/packages/core/fixtures/corpus"

          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/dep-guard@${VERSION}"

          # "totally-made-up-hallucinated-xyz123" is checked against the
          # fixture's bloom filter, which has a nonzero false-positive rate
          # by construction. That is a deterministic property of this exact
          # string against this exact committed fixture, not a per-run coin
          # flip - verified by hand not to collide as of the fixture in
          # this checkout. If the fixture corpus is ever rebuilt and this
          # starts colliding, this step fails every run, loudly, until the
          # placeholder name below is swapped for one that doesn't; it does
          # not fail silently or intermittently.
          set +e
          ./node_modules/.bin/dep-guard check react --corpus-dir "${CORPUS}" --format json > known-out.json
          KNOWN_EC=$?
          ./node_modules/.bin/dep-guard check totally-made-up-hallucinated-xyz123 --corpus-dir "${CORPUS}" --format json > unknown-out.json
          UNKNOWN_EC=$?
          set -e

          if [[ "${KNOWN_EC}" -ne 0 ]]; then
            echo "::error::Expected 'dep-guard check react' to exit 0 (react is in the fixture corpus)."
            cat known-out.json || true
            exit 1
          fi

          if [[ "${UNKNOWN_EC}" -eq 0 ]]; then
            echo "::error::Expected 'dep-guard check totally-made-up-hallucinated-xyz123' to exit non-zero (unknown-package finding)."
            cat unknown-out.json || true
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('unknown-out.json', 'utf8'));
            const hit = (j.findings || []).some((f) => f.ruleId === 'unknown-package');
            if (!hit) {
              console.error('Expected an unknown-package finding', j);
              process.exit(1);
            }
          "
          echo "Release smoke passed."
