name: CI

# Push- and PR-triggered gate. dep-guard is a public repository, so standard
# GitHub-hosted runner minutes are free regardless of the org's billing
# state; this only validates pull requests and pushes to main, it never
# touches the shared self-hosted Mac runner. Tag-triggered release.yml
# re-verifies the same gates immediately before publish.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Typecheck
      run: pnpm typecheck

    - name: Lint (public repository hygiene guard)
      run: pnpm lint

    - name: Run tests
      run: pnpm test
